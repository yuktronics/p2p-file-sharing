# coturn — TURN relay.
#
# Tuned per docs/FIREWALL-TRAVERSAL.md §3. Every option below earns its place:
# the defaults would lose whole classes of network.

listening-port=3478
tls-listening-port=5349

# On the SAME IP as HTTPS, but UDP :443 — a different port space from TCP :443,
# so this does not conflict with Caddy. Public TCP :443 reaches coturn through
# sslh, which routes SNI=turn.<domain> here on 5349.
# Do NOT set no-udp: UDP is the cheapest rung and the one ICE tries first.
# Do NOT set no-tcp-relay either — the server advertises three TURN rungs
# (udp :3478, tcp :3478, tls :443) and this option silently kills the middle
# one, so a peer behind a UDP-blocking firewall has nothing left to fall back
# to. It fails in the worst way: the allocation is refused as if it were an auth
# error. See docs/FIREWALL-TRAVERSAL.md §3.

# Rate limiting. Without it a relay is an open invitation to relay traffic for
# anyone who learns the shared secret.
max-bps=20000000
min-port=49152
max-port=65535

# Static auth secret. MUST be byte-identical to TURN_SECRET in
# /etc/signal/signal.env — that is what lets the Go server mint credentials
# itself (HMAC-SHA1 over the username) with no shared database. Generate one
# and write it to both - docs/DEPLOY-VPS.md step 8 does this with sed.
use-auth-secret
# static-auth-secret is set by DEPLOY-VPS.md step 8 and deliberately absent here
# so this file is safe to read and to commit. Coturn refuses to serve with
# use-auth-secret and no static-auth-secret, so this line is not optional.

stale-nonce=600
# The real bound on how long a minted credential can be used. Must equal
# TURN_TTL in the env file: the Go server stamps the expiry into the
# credential's username, and a client whose TTL outruns this gets an allocation
# it cannot renew. (There is no `max-credentials-lifetime` option — that name
# does not exist in coturn; see the note above the flag block.)
max-allocate-lifetime=3600

# Certificate. DEPLOY-VPS.md step 8 points these at the one Caddy already
# obtained, rather than running a second ACME client against the same domain.
# Note Caddy stores <domain>.crt / <domain>.key, NOT letsencrypt fullchain.pem.
# cert=/etc/letsencrypt/live/REPLACED_BY_INSTALL/fullchain.pem
# pkey=/etc/letsencrypt/live/REPLACED_BY_INSTALL/privkey.pem
# realm is substituted by DEPLOY-VPS.md step 8.
fingerprint

# Let the client choose its candidate pair and relay transparently. This is what
# lets ICE discover the server-reflexive mapping that direct connections need.
#
# `allow-loopback-peers` is deliberately NOT set. coturn refuses to start with
# it under pure TURN-REST-API auth:
#   CONFIG ERROR: allow_loopback_peers and empty cli password cannot be used together.
# and it warns "opens a possible security vulnerability. Do not use in production!!".
# It was only ever a same-machine testing convenience, and direct P2P on loopback
# needs no relay at all, so nothing is lost by leaving it off.
no-multicast-peers

# Performance flags, omitted deliberately.
#
# `--udp-recvmmsg`, `--multiplex-peer` and `--udp-gso` are not options in older
# coturn releases (check yours with the command below). A config file also rejects the
# leading `--` outright: it parses bare option names, so even a valid flag
# written that way fails with "Bad configuration format". Both mistakes are
# startup-fatal — coturn exits 255 and systemd gives up after five restarts.
#
# Before adding any option here, check it against the binary on the host:
#   turnserver -h 2>&1 | grep -oE '\-\-[a-z0-9-]+' | sed 's/^--//' | sort -u
# then confirm each line in this file appears in that list. An unknown option
# is never ignored — it refuses to boot.

# Logging. This needs both halves to work, and getting either one wrong leaves
# coturn completely silent — which is how a startup failure cost an hour here.
#
# `no-stdout-log` keeps client IPs out of the journal. This is a privacy product;
# relay logs would undo that in the one place the data actually passes through.
no-stdout-log
# With no-stdout-log, coturn writes ONLY to a file, and its default search path
# starts at /var/tmp. The systemd unit sets `PrivateTmp=yes`, so that file lands
# in a private mount namespace and is invisible from the host: the process holds
# an fd to a path that does not exist, and `journalctl -u coturn` shows nothing
# after the first banner line. The real error was only findable by running
# turnserver by hand outside the unit.
#
# So pin the log to a path that survives PrivateTmp, and disable the
# PID+date filename suffix so logrotate can own the file.
log-file=/var/log/turnserver/coturn.log
simple-log
# (To debug something that does not reach that file, temporarily comment out
#  BOTH no-stdout-log and log-file, then read the journal. Remember to restore.)

# Soft limits: shed load rather than refuse outright, so a busy relay degrades
# instead of failing every allocation at once.
user-quota=12
total-quota=1200
