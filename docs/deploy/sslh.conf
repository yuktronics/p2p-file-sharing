# sslh-fork 2.x — SNI multiplexer on public TCP :443.
#
# What it solves
# --------------
# The ICE ladder offers TURN-over-TLS as
#   turns:<turn-host>:443?transport=tcp
# which is the rung that survives a grade-2 corporate firewall (80/443 open,
# everything else blocked) — exactly the network class that needs TURN most.
# But TCP :443 is also the only port where HTTPS works, and only one process can
# hold a given TCP port. So sslh takes :443 and routes on the SNI in the
# ClientHello: turn- goes to coturn, everything else goes to Caddy.
#
# FORMAT — this is sslh-fork 2.x block grammar. The older sslh 1.x form
#   on = "service = \"name\" { protocol = \"tls\"; ... }"
# is REJECTED by 2.1 with:
#   Unknown settings: /on:service = "turn" { ... }
# and a repeated `on =` additionally fails as "duplicate setting name".
# 2.x uses `listen: ( {...} );` and `protocols: ( {...} );` where the closing
# paren takes a semicolon. Reference: upstream example.cfg.
#
# UDP :443 is NOT claimed here. Caddy owns it for HTTP/3, and UDP is a separate
# port space, so TCP-only is what lets both live on one public IP.
#
# VERSION TRAP (verified 2026-10-07): this grammar is sslh-fork 2.x. Ubuntu
# noble ships sslh 1.22c, which rejects it — and 1.22c supports sni_hostnames
# with a minimal config (verbose/foreground/timeout/listen/protocols, no
# pidfile under the DynamicUser unit: /run/sslh.pid is denied). Serve the 2.x
# file only where the binary parses it; on noble write /etc/sslh.cfg by hand.

foreground: true;
inetd: false;
timeout: 5;
numeric: true;
pidfile: "/run/sslh.pid";

# Errors only. One log line per TLS handshake on a public :443 is both a
# disk-fill and a privacy leak — this product deliberately keeps client IPs out
# of the journal, and the relay is exactly where that matters most.
verbose-config-error: 3;
verbose-system-error: 3;
verbose-int-error: 3;
verbose-connections: 0;
verbose-connections-error: 0;
verbose-probe-error: 0;

# TCP :443 only, stated explicitly rather than left to a default.
listen:
(
    { host: "0.0.0.0"; port: "443"; is_udp: false; keepalive: true; }
);

# Most specific first. The first entry matches on SNI; the second has no
# sni_hostnames, so it matches whatever TLS is left and MUST stay last — put
# it first and every request goes to coturn.
#
# sni_hostnames takes glob(7) patterns, so a wildcard covers extra relay
# hostnames without editing this file.
protocols:
(
     { name: "tls"; host: "127.0.0.1"; port = "5349";
       sni_hostnames: [ "turn-files.example.com" ];
       log_level: 0; tfo_ok: true; },

     { name: "tls"; host: "127.0.0.1"; port = "8080";
       log_level: 0; tfo_ok: true; }
);
